name: Deploy to GitHub Pages

on:
  push:
    # main publishes. dev only runs the checks — lint, tests, build, smoke —
    # so a push there says whether it is safe to merge, without going live.
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per branch: a check run on dev never queues behind a deploy, and
# deploys from main still run one at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 24 is the Active LTS (Krypton). Homebrew installs microfolio
          # against its unversioned `node` formula, which tracks Current — so
          # the LTS is what gets tested here, while engines.node keeps 22.13
          # as the floor (pnpm 11 uses node:sqlite and refuses to run below it).
          node-version: '24'

      # The exact pnpm version lives here rather than in package.json's
      # "packageManager". That field makes pnpm switch to the pinned version, and
      # for any 11.x target the switch goes through @pnpm/exe, which has published
      # no macOS Intel binary since pnpm 11 — so it can never succeed there. The
      # runner is linux-x64 and can afford a pin; the people cloning this cannot.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Install dependencies
        run: pnpm install

      # The demo set, the lint and the end-to-end suite are for developing
      # microfolio itself. A fork or a clone publishes someone's portfolio: its
      # projects are not the demo, its Markdown was not written for Prettier,
      # and the e2e suite counts on the demo's thirty projects — so those three
      # steps run on the upstream repository only. The unit tests, the build
      # and the smoke test of what was built run everywhere.
      #
      # Same command a user runs to look at the demo locally.
      - name: Install the demo projects
        if: github.repository == 'aker-dev/microfolio'
        run: pnpm demo

      - name: Lint
        if: github.repository == 'aker-dev/microfolio'
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # The e2e suite drives the demo content unzipped above: it relies on there
      # being enough projects for a second page of results.
      #
      # No --with-deps. The runner image already carries every library Chromium
      # links against — the log of a run that used it reports each one "already
      # the newest version" — so all it added was 21.1 MB of CJK, Thai and
      # Cyrillic font packages from apt. On 2026-08-19 that mirror served them at
      # 14.8 kB/s and the step took 25 minutes instead of its usual 21 seconds.
      # This site is Latin-script; if a locale ever needs those glyphs, the fix is
      # `playwright install-deps chromium`, not paying for them on every run.
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: End-to-end tests
        if: github.repository == 'aker-dev/microfolio'
        run: pnpm test:e2e

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      # Everything above this line tested the dev server, and finished before the
      # build even started. This is the only step that loads what actually ships:
      # it serves build/ and walks its pages. The map once came up blank in
      # production while `pnpm dev` was perfect and every test above passed.
      - name: Smoke test the built site
        run: pnpm test:smoke

      # After both suites, so a failure in either is reported. They write to the
      # same playwright-report/, and only one of them can have failed.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

  # microfolio is written on macOS and published from Linux, so the Windows path
  # was only ever tested by hand — which is how `pnpm build` came to spawn `npx`
  # in the one way Node refuses there, and how two scripts came to compare
  # `file://${process.argv[1]}` against import.meta.url and quietly do nothing.
  # This job is what would have caught both.
  #
  # Deliberately short: install, demo, build, load what was built. Lint and the
  # e2e suite stay on ubuntu — neither is platform-specific, and both would only
  # double the wait. It does not gate `deploy`: the site ships from the ubuntu
  # build, and a Windows regression is a red check to fix, not a reason to hold
  # a publication. Actions minutes are free on a public repository; a private
  # fork pays Windows at twice the Linux rate.
  windows:
    runs-on: windows-latest
    # The default is six hours. Nothing here takes ten minutes.
    timeout-minutes: 30
    # Nothing is published from here, so not the workflow's pages/id-token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      # sharp needs no toolchain here: 0.35 has no install script at all, and
      # the lockfile already carries the prebuilt @img/sharp-win32-x64, which
      # bundles its own libvips rather than splitting it out as on Linux.
      - name: Install dependencies
        run: pnpm install

      # Same guard as the ubuntu job, for the same reason: a fork publishes its
      # own projects, and the smoke suite takes the first project it finds — so
      # unzipping the demo over a fork's content would test somebody else's.
      # A fork with no projects at all stays green: firstProjectRoute() returns
      # null and is filtered out.
      - name: Install the demo projects
        if: github.repository == 'aker-dev/microfolio'
        run: pnpm demo

      # playwright.smoke.config.js names no `projects`, so it runs the default
      # browser, chromium — and the Windows image ships none. Before the build,
      # so a missing browser fails in a minute rather than after everything.
      # No --with-deps: that step is apt, and there is no apt here.
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      # The build alone would pass with every thumbnail missing, since the image
      # step is a separate process whose exit code was the only thing checked.
      # This loads the artefact and asks it for its files.
      - name: Smoke test the built site
        run: pnpm test:smoke

      # A different name from the ubuntu job's: two jobs of one run uploading
      # the same artifact name is a 409, and it would hide the failure that
      # matters.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-windows
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
