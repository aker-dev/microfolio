name: Deploy to GitHub Pages

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate example projects
        run: |
          cd content/projects
          unzip -o example_projects.zip

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # pnpm 11 uses node:sqlite and refuses to run below 22.13
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      # example_projects.zip holds only JPEGs, so without this the demo served
      # every thumbnail at full size while a local build served WebP. Placed
      # before the tests rather than just before the build, so lint, unit tests,
      # e2e and the build all see the content the visitor will get. Around 6s
      # for 400 images, and it skips whatever is already up to date.
      - name: Optimize images
        run: pnpm run optimize-images

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # The e2e suite drives the demo content unzipped above: it relies on there
      # being enough projects for a second page of results.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
