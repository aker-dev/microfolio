name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate example projects
        run: |
          cd content/projects
          unzip -o example_projects.zip

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # pnpm 11 uses node:sqlite and refuses to run below 22.13
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # The e2e suite drives the demo content unzipped above: it relies on there
      # being enough projects for a second page of results.
      #
      # No --with-deps. The runner image already carries every library Chromium
      # links against — the log of a run that used it reports each one "already
      # the newest version" — so all it added was 21.1 MB of CJK, Thai and
      # Cyrillic font packages from apt. On 2026-08-19 that mirror served them at
      # 14.8 kB/s and the step took 25 minutes instead of its usual 21 seconds.
      # This site is Latin-script; if a locale ever needs those glyphs, the fix is
      # `playwright install-deps chromium`, not paying for them on every run.
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      # Everything above this line tested the dev server, and finished before the
      # build even started. This is the only step that loads what actually ships:
      # it serves build/ and walks its pages. The map once came up blank in
      # production while `pnpm dev` was perfect and every test above passed.
      - name: Smoke test the built site
        run: pnpm test:smoke

      # After both suites, so a failure in either is reported. They write to the
      # same playwright-report/, and only one of them can have failed.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
