<!doctype html>
<html lang="%sveltekit.lang%" dir="%sveltekit.dir%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- The typeface: filled in by src/hooks.server.js from the font block of
		     src/lib/config.js, so that changing it survives an update of microfolio
		     (config.js is yours, this file is not). In the HTML rather than through
		     an @import in app.css: found while the markup is still being parsed, it
		     is fetched alongside the app's own stylesheet instead of after it. -->
		%microfolio.font%
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'dark') document.documentElement.classList.add('dark');
					else if (t === 'light') document.documentElement.classList.add('light');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="bg-background px-4" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
